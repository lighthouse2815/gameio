      <path d="M32 0H0V32" fill="none" stroke="#242424"/>
    </pattern>
  </defs>
  <rect width="960" height="360" fill="#0b0b0b"/>
  <rect width="960" height="360" fill="url(#mancala-grid)"/>
  <path d="M0 34H960M0 326H960" stroke="#f0442e" stroke-width="2"/>
  <g transform="translate(520 86)">
    <rect width="386" height="188" rx="52" fill="#121212" stroke="#777" stroke-width="2"/>
    <ellipse cx="42" cy="94" rx="25" ry="66" fill="#0b0b0b" stroke="#5b5b5b" stroke-width="2"/>
    <ellipse cx="344" cy="94" rx="25" ry="66" fill="#17100f" stroke="#f0442e" stroke-width="2"/>
    <g fill="#0b0b0b" stroke="#4c4c4c" stroke-width="2">
      <circle cx="92" cy="58" r="24"/><circle cx="142" cy="58" r="24"/><circle cx="192" cy="58" r="24"/><circle cx="242" cy="58" r="24"/><circle cx="292" cy="58" r="24"/>
      <circle cx="92" cy="130" r="24"/><circle cx="142" cy="130" r="24"/><circle cx="192" cy="130" r="24"/><circle cx="242" cy="130" r="24"/><circle cx="292" cy="130" r="24"/>
    </g>
    <g fill="#e8e8e8" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
      <text x="92" y="63">4</text><text x="142" y="63">2</text><text x="192" y="63">6</text><text x="242" y="63">1</text><text x="292" y="63">5</text>
      <text x="92" y="135">3</text><text x="142" y="135">7</text><text x="192" y="135">2</text><text x="242" y="135">5</text><text x="292" y="135">4</text>
      <text x="42" y="100" font-size="22">11</text><text x="344" y="100" font-size="22" fill="#f0442e">18</text>
