    <text x="60" y="205" font-size="88" font-weight="900" letter-spacing="-6">MANCALA</text>
    <text x="64" y="252" font-size="15" letter-spacing="4" fill="#f0442e">SOW / CAPTURE / STORE</text>
    <text x="64" y="302" font-size="13" letter-spacing="3" fill="#8e8e8e">12 PITS / BONUS TURN / SERVER SCORE</text>
