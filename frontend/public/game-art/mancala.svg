<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Mancala</title>
  <desc id="desc">A dark technical Mancala board with two stores and twelve numbered seed pits.</desc>
  <defs>
