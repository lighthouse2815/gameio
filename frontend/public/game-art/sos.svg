<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">SOS</title>
  <desc id="desc">A six by six SOS letter grid with a highlighted scoring sequence.</desc>
  <rect width="960" height="360" fill="#0b0b0b"/>
  <defs>
    <pattern id="sos-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#272727"/>
    </pattern>
  </defs>
  <rect width="960" height="360" fill="url(#sos-grid)"/>
  <path d="M0 34H960M0 326H960" stroke="#f0442e" stroke-width="2"/>
  <g transform="translate(610 45)">
    <rect width="270" height="270" fill="#121212" stroke="#777" stroke-width="2"/>
    <g stroke="#3b3b3b"><path d="M45 0V270M90 0V270M135 0V270M180 0V270M225 0V270"/><path d="M0 45H270M0 90H270M0 135H270M0 180H270M0 225H270"/></g>
    <path d="M45 225L180 90" stroke="#f0442e" stroke-width="8" opacity=".22"/>
    <g fill="#ededed" font-family="Arial, sans-serif" font-size="25" font-weight="900" text-anchor="middle">
      <text x="22" y="34">S</text><text x="112" y="79">O</text><text x="247" y="79">S</text><text x="67" y="124">O</text><text x="202" y="169">S</text><text x="112" y="214">S</text>
    </g>
    <g fill="#f0442e" font-family="Arial, sans-serif" font-size="28" font-weight="900" text-anchor="middle">
      <text x="67" y="214">S</text><text x="112" y="169">O</text><text x="157" y="124">S</text>
    </g>
    <path d="M48 231h38M94 186h38M139 141h38" stroke="#f0442e" stroke-width="2"/>
  </g>
  <g fill="#f2f2f2" font-family="Arial, sans-serif">
    <text x="64" y="82" font-size="16" letter-spacing="5">SEQUENCE SCORING ARRAY</text>
    <text x="60" y="216" font-size="126" font-weight="900" letter-spacing="4">S<tspan fill="#f0442e">O</tspan>S</text>
    <text x="64" y="263" font-size="15" letter-spacing="4" fill="#f0442e">PLACE / LINK / SCORE</text>
    <text x="64" y="306" font-size="13" letter-spacing="3" fill="#8e8e8e">LETTER CHOICE / MULTI-LINE COMBO / SERVER COUNT</text>
  </g>
</svg>
