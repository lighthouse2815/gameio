<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Rock Paper Scissors</title>
  <desc id="desc">Three sealed choice modules for Rock Paper Scissors.</desc>
