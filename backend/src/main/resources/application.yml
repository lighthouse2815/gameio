spring:
  application:
    name: gameio-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gameio}
    username: ${DB_USERNAME:gameio}
    password: ${DB_PASSWORD:gameio}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gameio:
  security:
    jwt:
      issuer: ${JWT_ISSUER:gameio-api}
      secret: ${JWT_SECRET:local-development-secret-change-before-deploying-2026}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
    refresh-cookie:
      name: ${REFRESH_COOKIE_NAME:gameio_refresh}
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
      domain: ${REFRESH_COOKIE_DOMAIN:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
